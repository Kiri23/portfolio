# Producción en vps1. Sin ports: el 80 y el 443 son del borde compartido
# kiri-edge (Kiri23/kiriInfra, services/kiri-edge, el mismo caddy-docker-proxy
# que en vps2). Su controller lee las labels caddy de los contenedores en la
# red kiri-edge y le manda la config al server: no hay Caddyfile que editar ni
# reload que hacer. La imagen es pública y se construye en CI: acá no hay
# build.
#
# Sin container_name: el controller engancha por la IP del contenedor en
# kiri-edge ({{upstreams 8080}}), no por nombre.
#
# El dominio kiri231.com apunta en DNS a vps1 (Cloudflare proxied) y kiri-edge
# le manda la raíz a este contenedor por el label de abajo.
name: portfolio

services:
  portfolio:
    image: ghcr.io/kiri23/portfolio:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - kiri-edge
    labels:
      # Sin www: el wildcard *.kiri231.com apunta a vps2, no a vps1 — un
      # www.kiri231.com acá caería en el servidor equivocado.
      caddy: kiri231.com
      caddy.reverse_proxy: "{{upstreams 8080}}"   # el puerto DENTRO del contenedor

networks:
  kiri-edge:
    # La crea el job deploy antes del up: compose no crea redes external.
    external: true
